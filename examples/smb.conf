# smb.conf — the guide's lab configuration.
# Install at /etc/samba/smb.conf, check with: testparm -s
[global]
   workgroup = WORKGROUP
   server string = Lab Samba Server
   security = user
   map to guest = never
   log file = /var/log/samba/log.%m
   max log size = 1000

[labshare]
   comment = Guide lab share
   path = /srv/labshare
   browseable = yes
   read only = no
   valid users = labuser
